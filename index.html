<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=https://wa.me/8615871350127?text=Hi%2C%20I%20just%20placed%20an%20order.%20Please%20confirm%20and%20arrange%20shipment.">
<title>Puresensez - Order Confirmation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 28px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .checkmark {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #25D366;
    margin: 0 auto 16px;
    display: flex;
    align-items: center; justify-content: center;
    color: #fff; font-size: 30px;
  }
  h1 {
    font-size: 22px;
    color: #111;
    margin-bottom: 12px;
    line-height: 1.3;
  }
  p {
    color: #555;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .warning {
    color: #d32f2f;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .footer {
    margin-top: 16px;
    color: #999;
    font-size: 12px;
  }
  .footer .dots::after {
    content: '';
    animation: dots 1.5s steps(3, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    33%  { content: '.'; }
    66%  { content: '..'; }
    100% { content: '...'; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="checkmark">&#10003;</div>
  <div style="color:#888;font-size:13px;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;">Puresensez</div>
  <h1>Order Received!</h1>
  <p>COD orders require confirmation before shipping.</p>
  <p class="warning">This step is required for shipment.</p>
  <div id="wa-footer" class="footer">Opening WhatsApp<span class="dots"></span></div>
</div>

<script>
(function(){
  // Visual countdown only (actual redirect handled by meta refresh)
  var sec = 3;
  var footer = document.getElementById('wa-footer');
  var tick = setInterval(function(){
    sec--;
    if (sec <= 0) {
      footer.textContent = 'Opening WhatsApp...';
      clearInterval(tick);
    } else {
      footer.textContent = 'Opening WhatsApp in ' + sec + 's';
    }
  }, 1000);
})();
</script>
</body>
</html>
